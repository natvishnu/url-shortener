# ---------------------------------------------------------------------------
# URL Shortener configuration
#
# All settings below are system-wide (no per-URL overrides), matching the
# design's assumption that DEFAULT_EXPIRY_DURATION and INACTIVITY_WINDOW are
# tuned only at the service level (§8).
# ---------------------------------------------------------------------------

spring.application.name=url-shortener
server.port=8080

# ---------------------------------------------------------------------------
# Persistence (§4) — H2 in-memory, standing in for the partitioned Postgres of
# the design (§6.7). DB_CLOSE_DELAY=-1 keeps the in-memory DB alive for the whole
# JVM lifetime rather than dropping it when the last connection closes.
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:urlshortener;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Browsable DB console for local development at http://localhost:8080/h2-console
# (JDBC URL: jdbc:h2:mem:urlshortener).
spring.h2.console.enabled=true

# ---------------------------------------------------------------------------
# API documentation (springdoc-openapi / Swagger UI)
#   Swagger UI : http://localhost:8080/swagger-ui.html
#   OpenAPI 3  : http://localhost:8080/v3/api-docs
# ---------------------------------------------------------------------------
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operations-sorter=method

# FR-4: expiry applied when the caller omits user_expires_at at creation time.
# ISO-8601 duration (e.g. P30D = 30 days, PT12H = 12 hours).
urlshortener.default-expiry-duration=P30D

# NFR-6: a URL not accessed within this window is auto-expired by the reaper,
# independent of its user_expires_at.
urlshortener.inactivity-window=P90D

# §6.1: worker id for the Snowflake-style code generator; must be distinct per
# running instance so generated codes never collide across instances.
urlshortener.worker-id=1

# §6.2: custom aliases may not take any of these reserved codes.
urlshortener.reserved-aliases=api,admin,top,analytics,health,actuator

# §6.6: background expiry reaper.
urlshortener.reaper.interval-millis=60000
urlshortener.reaper.safety-cap-percent=20
